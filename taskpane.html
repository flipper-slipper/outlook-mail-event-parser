<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Event Extractor</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app">
    <header>
      <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8"  y1="2" x2="8"  y2="6"/>
        <line x1="3"  y1="10" x2="21" y2="10"/>
        <text x="12" y="19" text-anchor="middle" font-size="7" font-family="Segoe UI,sans-serif" font-weight="700" fill="currentColor" stroke="none">AI</text>
      </svg>
      <h1>Calendar Event Extractor</h1>
    </header>

    <div id="config-section">
      <label for="api-key">Gemini API Key</label>
      <div class="input-row">
        <input type="password" id="api-key" placeholder="AIza..." autocomplete="off" />
        <button id="save-key-btn">Save</button>
      </div>
      <p id="key-status" class="status-text"></p>
    </div>

    <div id="action-section">
      <button id="extract-btn" class="primary-btn">Extract Events from Email</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyzing email for events...</p>
    </div>

    <div id="error-banner" class="hidden error-banner">
      <span id="error-message"></span>
    </div>

    <div id="results-section" class="hidden">
      <h2 id="results-count"></h2>
      <div id="events-list"></div>
    </div>

    <div id="no-events" class="hidden">
      <p class="muted">No calendar events found in this email.</p>
    </div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
